<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Roteador de Entregas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-pagina">
    <section class="card login-card">
      <div class="card-head">
        <h2>🛵 Roteador de Entregas</h2>
      </div>
      <p class="hint login-sub">Central de despacho · Logística Rápida</p>

      <form class="form" action="painel.html" method="get">
        <div class="fld">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" name="usuario" required>
        </div>
        <div class="fld">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <div class="acoes">
          <button type="submit" class="btn btn-pri login-btn">Entrar na central</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
